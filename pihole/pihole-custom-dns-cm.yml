apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-custom-dns
  namespace: pihole
  labels:
    app: pihole
    app.kubernetes.io/component: dns
    app.kubernetes.io/name: pihole
    app.kubernetes.io/part-of: dns-config
data:
  # argocd/novnc/obsidian/vscode all route through Traefik ingress.
  # pihole.i3sec.com.au moved to the Traefik ingress (valid TLS cert,
  # and the ArgoCD link icon works) on 2026-07-05; the direct pihole-web
  # LoadBalancer remains reachable at http://192.168.2.240:8080/admin/.
  # Both moved off k3s ServiceLB (192.168.2.10) to MetalLB floating IPs
  # on 2026-07-03 - see day1-foundation apps/metallb/README.md.
  02-i3sec-custom-dns.conf: |
    # Global: dnsmasq has no working per-domain AAAA suppression, only a
    # network-wide toggle. Every address= line below is IPv4-only, so
    # without this, AAAA queries for these hosts fall through to upstream
    # and leak the real public (Cloudflare) answer - bypassing split-horizon
    # entirely for any host that also has a public DNS presence. IPv6 is
    # believed off at the router; this is the DNS-side half of that.
    filter-AAAA
    # Same leak, different record type: address= only overrides A/AAAA, not
    # the newer HTTPS/SVCB record (type 65) that HTTP/3-capable browsers use
    # for connection hints. Confirmed 2026-07-15 that qnap.i3sec.com.au's
    # HTTPS record was passing through untouched with Cloudflare's real
    # anycast ipv4hint - a client that preferred those hints over the
    # (correctly overridden) A record would bypass split-horizon entirely
    # and hit Cloudflare's edge, where the qnap host now fails closed under
    # the default-deny mTLS WAF rule. filter-rr=65 strips HTTPS records
    # globally, the same way filter-AAAA does for AAAA.
    filter-rr=65
    address=/argocd.i3sec.com.au/192.168.20.239
    address=/pihole.i3sec.com.au/192.168.20.239
    address=/novnc.i3sec.com.au/192.168.20.239
    address=/obsidian.i3sec.com.au/192.168.20.239
    address=/vscode.i3sec.com.au/192.168.20.239
    address=/ca.i3sec.com.au/192.168.20.239
    address=/paperless.i3sec.com.au/192.168.20.239
    address=/adminer.i3sec.com.au/192.168.20.239
    address=/jellyfin.i3sec.com.au/192.168.20.239
    address=/calibre-web.i3sec.com.au/192.168.20.239
    address=/sonarr.i3sec.com.au/192.168.20.239
    address=/radarr.i3sec.com.au/192.168.20.239
    address=/prowlarr.i3sec.com.au/192.168.20.239
    address=/sabnzbd.i3sec.com.au/192.168.20.239
    address=/bazarr.i3sec.com.au/192.168.20.239
    address=/jdownloader.i3sec.com.au/192.168.20.239
    address=/lazylibrarian.i3sec.com.au/192.168.20.239
    address=/whisparr.i3sec.com.au/192.168.20.239
    address=/grafana.i3sec.com.au/192.168.20.239
    address=/influxdb.i3sec.com.au/192.168.20.239
    address=/homeassistant.i3sec.com.au/192.168.20.239
    address=/immich.i3sec.com.au/192.168.20.239
    address=/backup-status.i3sec.com.au/192.168.20.239
    address=/movie-status.i3sec.com.au/192.168.20.239
    address=/reports.i3sec.com.au/192.168.20.239
    address=/open-webui.i3sec.com.au/192.168.20.239
    # Suppress AAAA for immich specifically - filter-AAAA global doesn't
    # prevent all AAAA leaks, so explicit per-domain suppression needed
    address=/immich.i3sec.com.au/::
    # Anything only on the nginx ingress class (Cloudflare Tunnel-routed,
    # no separate traefik-class ingress) resolves to ingress-nginx's own
    # VIP instead of traefik's - see day0-bootstrap apps/ingress-nginx.
    address=/books.i3sec.com.au/192.168.20.238
    # Moved from 192.168.2.30 (main-LAN "valinor" identity) to
    # 192.168.20.30 (Trusted/VLAN20, the "valinor-m" backend identity)
    # 2026-08-30 - QNAP consolidated to a single interface as part of
    # the VLAN20 backend migration (see day0-infra-build's
    # effervescent-squishing-token plan / memory
    # project_vlan20_backend_migration). qnap.i3sec.com.au is now the
    # one and only QNAP address, for both general/web access and
    # cluster storage traffic.
    address=/qnap.i3sec.com.au/192.168.20.30
    cname=files.i3sec.com.au,qnap.i3sec.com.au
    # Device names, moved here from the UDM's local_dns_record (unifi-tf
    # clients.tf) 2026-10-03: DHCP hands out only these Pi-holes, so the
    # UDM-local records were never reachable by any client. host-record
    # (not address=) so the reverse lookup works too - Pi-hole's query log
    # shows names instead of bare IPs. The MAC->IP reservation stays in
    # unifi-tf clients.tf; if a reservation changes there, change the
    # matching line here in the same pass.
    host-record=googlehome-lounge.i3sec.com.au,192.168.2.69
    host-record=googlehome-shed.i3sec.com.au,192.168.2.40
    host-record=googlehome-clock.i3sec.com.au,192.168.2.188
    host-record=googlehome-bar.i3sec.com.au,192.168.2.197
    host-record=chromecast-pergola.i3sec.com.au,192.168.2.196
    # pinode-01 is on Trusted (VLAN20) since the 2026-08-30 backend
    # migration. The UDM record said 192.168.2.11 (the old main-LAN
    # identity) - not carried over.
    host-record=pinode-01.i3sec.com.au,192.168.20.11
