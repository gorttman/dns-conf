apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-custom-dns
  namespace: pihole
  labels:
    app: pihole
    app.kubernetes.io/component: dns
    app.kubernetes.io/name: pihole
    app.kubernetes.io/part-of: dns-config
data:
  # argocd/novnc/obsidian/vscode all route through Traefik ingress.
  # pihole.i3sec.com.au moved to the Traefik ingress (valid TLS cert,
  # and the ArgoCD link icon works) on 2026-07-05; the direct pihole-web
  # LoadBalancer remains reachable at http://192.168.2.240:8080/admin/.
  # Both moved off k3s ServiceLB (192.168.2.10) to MetalLB floating IPs
  # on 2026-07-03 - see day1-foundation apps/metallb/README.md.
  02-i3sec-custom-dns.conf: |
    # Global: dnsmasq has no working per-domain AAAA suppression, only a
    # network-wide toggle. Every address= line below is IPv4-only, so
    # without this, AAAA queries for these hosts fall through to upstream
    # and leak the real public (Cloudflare) answer - bypassing split-horizon
    # entirely for any host that also has a public DNS presence. IPv6 is
    # believed off at the router; this is the DNS-side half of that.
    filter-AAAA
    # Same leak, different record type: address= only overrides A/AAAA, not
    # the newer HTTPS/SVCB record (type 65) that HTTP/3-capable browsers use
    # for connection hints. Confirmed 2026-07-15 that qnap.i3sec.com.au's
    # HTTPS record was passing through untouched with Cloudflare's real
    # anycast ipv4hint - a client that preferred those hints over the
    # (correctly overridden) A record would bypass split-horizon entirely
    # and hit Cloudflare's edge, where the qnap host now fails closed under
    # the default-deny mTLS WAF rule. filter-rr=65 strips HTTPS records
    # globally, the same way filter-AAAA does for AAAA.
    filter-rr=65
    address=/argocd.i3sec.com.au/192.168.2.241
    address=/pihole.i3sec.com.au/192.168.2.241
    address=/novnc.i3sec.com.au/192.168.2.241
    address=/obsidian.i3sec.com.au/192.168.2.241
    address=/vscode.i3sec.com.au/192.168.2.241
    address=/ca.i3sec.com.au/192.168.2.241
    address=/paperless.i3sec.com.au/192.168.2.241
    address=/adminer.i3sec.com.au/192.168.2.241
    address=/jellyfin.i3sec.com.au/192.168.2.241
    address=/kavita.i3sec.com.au/192.168.2.241
    address=/sonarr.i3sec.com.au/192.168.2.241
    address=/radarr.i3sec.com.au/192.168.2.241
    address=/prowlarr.i3sec.com.au/192.168.2.241
    address=/sabnzbd.i3sec.com.au/192.168.2.241
    address=/bazarr.i3sec.com.au/192.168.2.241
    address=/jdownloader.i3sec.com.au/192.168.2.241
    address=/lazylibrarian.i3sec.com.au/192.168.2.241
    address=/grafana.i3sec.com.au/192.168.2.241
    address=/influxdb.i3sec.com.au/192.168.2.241
    address=/homeassistant.i3sec.com.au/192.168.2.241
    address=/n8n.i3sec.com.au/192.168.2.241
    # Anything only on the nginx ingress class (Cloudflare Tunnel-routed,
    # no separate traefik-class ingress) resolves to ingress-nginx's own
    # VIP instead of traefik's - see day0-bootstrap apps/ingress-nginx.
    address=/books.i3sec.com.au/192.168.2.242
    address=/qnap.i3sec.com.au/192.168.2.30
    cname=files.i3sec.com.au,qnap.i3sec.com.au
